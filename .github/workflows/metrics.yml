name: Metrics
on:
  schedule:
    - cron: "0 * * * *"          # Atualiza a cada hora
  workflow_dispatch:            # Permite execução manual
  push:
    branches: ["main", "master"]  # Dispara em push na branch principal

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write            # Necessário para commit
      pull-requests: write     # Habilite se usar output_action: pull-request
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Gerar métricas
        uses: lowlighter/metrics@latest
        with:
          # Use GITHUB_TOKEN para dados públicos ou PAT para dados privados
          token: ${{ secrets.GITHUB_TOKEN }}
          user: CaiohAlvino
          template: classic
          base: header,activity,community,repositories,metadata
          config_timezone: America/Sao_Paulo
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_followup: yes
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
